[workspace]
resolver = "2"
members = [
    "crates/spass-lexer",
    "crates/spass-parser",
    "crates/spass-semantic",
    "crates/spass-infer",
    "crates/spass-transform",
    "crates/spass-optimize",
    "crates/spass-runner",
    "crates/spass-codegen",
    "crates/spass-cli",
    "crates/spass-runtime",
    "crates/spass-bootstrap-core",
    "crates/spass-installer",
    "crates/spass-playground",
    "crates/spass-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Filowxy"]
description = "Spass language compiler - 3D spatial computation language"

[workspace.dependencies]
num-rational = "0.4"
num-traits = "0.2"
thiserror = "1"
anyhow = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
